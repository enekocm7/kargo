[package]
name = "zed-kargo"
description = "The Kargo extension for the Zed editor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Built by Zed for wasm32-wasip2, apart from Kargo's own workspace.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zed_extension_api = "0.7.0"
