name: JetBrains plugin

on:
  push:
    branches: [master]
    paths: ["editors/jetbrains/**", ".github/workflows/jetbrains.yml"]
  pull_request:
    paths: ["editors/jetbrains/**", ".github/workflows/jetbrains.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew buildPlugin test
      - name: Verify against recent IDEs
        run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: kargo-jetbrains
          path: editors/jetbrains/build/distributions/*.zip
