name: Neovim plugin

on:
  push:
    branches: [master]
    paths: ["editors/neovim/**", ".github/workflows/neovim.yml"]
  pull_request:
    paths: ["editors/neovim/**", ".github/workflows/neovim.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/neovim
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          curl -sSfL -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz
          tar -xzf nvim.tar.gz -C "$HOME"
          echo "$HOME/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Test
        run: nvim --headless -u NONE -l tests/run.lua
