name: VS Code extension

on:
  push:
    branches: [master]
    paths: ["editors/vscode/**", ".github/workflows/vscode.yml"]
  pull_request:
    paths: ["editors/vscode/**", ".github/workflows/vscode.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Package
        run: npm run package
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: kargo-vscode
          path: editors/vscode/kargo-vscode.vsix
