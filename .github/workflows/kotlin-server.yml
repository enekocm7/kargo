name: Kotlin server

on:
  # No path filter on pushes: a tag push has no changed paths to match.
  push:
    branches: [master]
    tags: ["kotlin-server-v*"]
  pull_request:
    paths: ["kotlin-server/**", ".github/workflows/kotlin-server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The server is a Kargo project, built by the Kargo of the same commit.
      - name: Build Kargo
        run: cargo build --release
      - name: Test the server
        working-directory: kotlin-server
        run: ../target/release/kargo test --locked

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Kargo
        run: cargo build --release
      - name: Package the server
        working-directory: kotlin-server
        run: |
          KARGO="$PWD/../target/release/kargo" sh dist/package.sh > SHA256SUMS
          mv SHA256SUMS target/dist/
          cat target/dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: kargo-kotlin-server
          path: |
            kotlin-server/target/dist/*.zip
            kotlin-server/target/dist/SHA256SUMS
      # Kargo pins the version and SHA-256 of a release in `KARGO_KOTLIN_SERVER_VERSION` and
      # `KARGO_KOTLIN_SERVER_SHA256` (crates/kargo-toolchain/src/language_server.rs).
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/kotlin-server-v')
        working-directory: kotlin-server/target/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "kargo-kotlin-server ${GITHUB_REF_NAME#kotlin-server-v}" --notes-file SHA256SUMS ./*.zip SHA256SUMS
