[package]
name = "kargo-kotlin-server"
version = "0.1.0"
group = "io.github.enekocm7.kargo"
description = "Kargo's Kotlin language server, on the Kotlin Analysis API"
license = "MIT OR Apache-2.0"

[kotlin]
version = "2.4.21"
opt-in = [
    "org.jetbrains.kotlin.analysis.api.KaExperimentalApi",
    "org.jetbrains.kotlin.analysis.api.KaPlatformInterface",
    "org.jetbrains.kotlin.analysis.api.KaImplementationDetail",
    "org.jetbrains.kotlin.analysis.api.permissions.KaAllowAnalysisOnEdt",
]

[dependencies]
# The Kotlin Analysis API in standalone mode with the IntelliJ core it runs on, as KSP2 bundles
# it: its `compiler.version` is the Kotlin frontend the server analyzes with.
"com.google.devtools.ksp:symbol-processing-aa" = "2.3.12"
"org.eclipse.lsp4j:org.eclipse.lsp4j" = "1.0.0"

[target.jvm]
jvm-target = "17"
main-class = "io.github.enekocm7.kargo.server.MainKt"
jvm-args = ["-Xmx2g"]
