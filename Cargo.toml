[package]
name = "kargo"
version = "0.1.0"
edition = "2024"
description = "A Cargo-like build tool and package manager for Kotlin"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[[bin]]
name = "kargo"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dirs = "7.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
rayon = "1.12.0"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
ureq = "3.4.2"
walkdir = "2.5.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
