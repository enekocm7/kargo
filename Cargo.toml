[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
kargo-util = { path = "crates/kargo-util", version = "0.1.0" }
kargo-maven = { path = "crates/kargo-maven", version = "0.1.0" }
kargo-manifest = { path = "crates/kargo-manifest", version = "0.1.0" }
kargo-toolchain = { path = "crates/kargo-toolchain", version = "0.1.0" }
kargo-compiler = { path = "crates/kargo-compiler", version = "0.1.0" }
kargo-ops = { path = "crates/kargo-ops", version = "0.1.0" }
kargo-lsp = { path = "crates/kargo-lsp", version = "0.1.0" }

anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# Pinned exactly: dynamic completion is behind clap_complete's `unstable-dynamic` feature.
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
dirs = "7.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
ignore = "0.4.33"
md5 = { package = "md-5", version = "0.11.0" }
rayon = "1.12.0"
roxmltree = "0.21.1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2"
toml = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
ureq = "3.4.2"
walkdir = "2.5.0"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[package]
name = "kargo-cli"
description = "A Cargo-like build tool and package manager for Kotlin"
repository = "https://github.com/enekocm7/kargo"
homepage = "https://enekocm7.github.io/kargo/"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
# The tests, website and editor plugins stay in the repository; the crate is the sources of the binary.
include = ["/src/**", "/README.md", "/Cargo.toml", "/Cargo.lock"]

[[bin]]
name = "kargo"
path = "src/main.rs"

[dependencies]
kargo-util.workspace = true
kargo-maven.workspace = true
kargo-manifest.workspace = true
kargo-toolchain.workspace = true
kargo-compiler.workspace = true
kargo-ops.workspace = true
kargo-lsp.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
flate2.workspace = true
predicates.workspace = true
tar.workspace = true
tempfile.workspace = true
zip.workspace = true

# Release binaries are small and fast to start; `cargo build --release` stays quick enough for CI.
[profile.release]
strip = true
lto = "thin"

# `cargo binstall kargo-cli` downloads the archives of the release workflow (.github/workflows/release.yml).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/kargo-{ version }-{ target }.tar.gz"
bin-dir = "kargo-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/kargo-{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/kargo-{ version }-{ target }.zip"
pkg-fmt = "zip"
